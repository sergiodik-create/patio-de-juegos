<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichas para imprimir · Patio de Juegos</title>
<link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{css}}">
<link rel="stylesheet" href="imprimir.css">
</head>
<body class="printable">
<div class="noprint ptools">
  <p class="brand" data-t><span>Patio</span> <span>de</span> <span>Juegos</span></p>
  <h1 data-t>Fichas para imprimir</h1>
  <p class="note" data-t>Elige una ficha, pulsa «Otra» hasta que te guste y después «Imprimir». Cada vez sale distinta.</p>
  <div class="row" id="types"></div>
  <div class="row" id="levels"></div>
  <div class="row"><button class="pill" id="again" data-t>↻ Otra</button><button class="pill go" id="print" data-t>🖨️ Imprimir</button><a class="pill" href="./" data-t>← Volver a los juegos</a></div>
</div>
<div id="sheets"></div>
<script src="{{lib}}"></script>
<script src="fichas.js"></script>
